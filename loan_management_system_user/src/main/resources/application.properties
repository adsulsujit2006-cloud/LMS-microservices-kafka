
spring.application.name=loan_management_system_user
server.port=1000


# =========================================================
# DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/lmsdatatest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# EUREKA CLIENT CONFIGURATION
# =========================================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka


# =========================================================
# NOTIFICATION SERVICE CONFIGURATION
# =========================================================

notification.service.url=http://localhost:1001
